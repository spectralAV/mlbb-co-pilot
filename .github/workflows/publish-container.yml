name: Publish Container Package

on:
  workflow_dispatch:
  push:
    tags:
      - "mobile-legends-v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/spectralav/mlbb-co-pilot

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract package version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:mobile-legends-v${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=MLBB Co-Pilot
            org.opencontainers.image.description=Semantic tactical intelligence system for Mobile Legends: Bang Bang.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
